<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            padding: 12px 5px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>My To-Do List</h1>

    <input type="text" id="taskInput"
           placeholder="Enter a task">

    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>

    <p id="remaining">0 tasks remaining</p>
</div>

<script>
    let tasks = [];

    function addTask() {
        let input = document.getElementById("taskInput");
        let text = input.value.trim();

        if (text === "") return;

        tasks.push({
            text: text,
            done: false
        });

        input.value = "";
        displayTasks();
    }

    function displayTasks() {
        let list = document.getElementById("taskList");
        list.innerHTML = "";

        tasks.forEach((task, index) => {
            let li = document.createElement("li");

            let span = document.createElement("span");
            span.textContent = task.text;

            if (task.done) {
                span.className = "done";
            }

            span.onclick = function() {
                task.done = !task.done;
                displayTasks();
            };

            let btn = document.createElement("button");
            btn.textContent = "Delete";

            btn.onclick = function() {
                tasks.splice(index, 1);
                displayTasks();
            };

            li.appendChild(span);
            li.appendChild(btn);
            list.appendChild(li);
        });

        let count = tasks.filter(t => !t.done).length;

        document.getElementById("remaining").textContent =
            count + " of " + tasks.length + " tasks remaining";

        if (tasks.length === 0) {
            document.getElementById("remaining").textContent =
                "No tasks yet. Add one above!";
        }
    }

    document.getElementById("taskInput")
        .addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                addTask();
            }
        });

    displayTasks();
</script>

</body>
</html>
